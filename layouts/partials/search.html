{{/*
  Partial: search.html
  Renders a Pagefind-powered search bar.
  The search UI is a simple input that triggers Pagefind's search modal/overlay.
  Pagefind JS/CSS are loaded from /_pagefind/ after the build:index step.
*/}}
<div id="search-container" class="relative">
  <div class="relative">
    <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400 dark:text-stone-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
    </svg>
    <input
      id="search-input"
      type="text"
      placeholder="Cari novel atau bab..."
      class="w-full rounded-full border border-stone-200 bg-stone-50 py-3 pl-11 pr-4 text-sm text-stone-900 shadow-[0_1px_0_rgba(28,25,23,0.04),0_4px_16px_-8px_rgba(28,25,23,0.06)] placeholder:text-stone-400 focus:border-stone-900 focus:outline-none focus:ring-0 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-50 dark:placeholder:text-stone-500 dark:focus:border-stone-100"
      aria-label="Cari novel atau bab"
    />
  </div>
  <div id="search-results" class="mt-3 hidden">
    <div class="rounded-2xl border border-stone-200 bg-stone-50 p-4 shadow-[0_1px_0_rgba(28,25,23,0.04),0_8px_24px_-12px_rgba(28,25,23,0.08)] dark:border-stone-700 dark:bg-stone-900">
      <div id="search-status" class="mb-2 text-xs text-stone-500 dark:text-stone-400"></div>
      <div id="search-hits" class="grid gap-2"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    var input = document.getElementById('search-input');
    var results = document.getElementById('search-results');
    var status = document.getElementById('search-status');
    var hits = document.getElementById('search-hits');
    var pagefind = null;
    var debounceTimer = null;

    async function loadPagefind() {
      if (pagefind) return;
      try {
        pagefind = await import('/_pagefind/pagefind.js');
        pagefind.init();
      } catch (e) {
        console.warn('Pagefind not available:', e.message);
        status.textContent = 'Pencarian belum tersedia.';
        results.classList.remove('hidden');
      }
    }

    function escapeHTML(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    function renderHits(data) {
      hits.innerHTML = '';
      if (!data.results || data.results.length === 0) {
        status.textContent = 'Tidak ada hasil ditemukan.';
        results.classList.remove('hidden');
        return;
      }
      status.textContent = data.results.length + ' hasil ditemukan.';
      data.results.slice(0, 8).forEach(function (result) {
        result.loadContent().then(function (content) {
          var card = document.createElement('a');
          card.href = result.url;
          card.className = 'block rounded-xl border border-stone-200 bg-stone-50/60 p-3 transition hover:border-stone-300 hover:bg-stone-50 dark:border-stone-700 dark:bg-stone-800/60 dark:hover:border-stone-600 dark:hover:bg-stone-800';
          var titleEl = document.createElement('p');
          titleEl.className = 'text-sm font-medium text-stone-900 dark:text-stone-50';
          titleEl.textContent = result.meta.title || '';
          var snippetEl = document.createElement('p');
          snippetEl.className = 'mt-1 line-clamp-2 text-xs text-stone-500 dark:text-stone-400';
          snippetEl.textContent = (content || '').substring(0, 120) + '\u2026';
          card.appendChild(titleEl);
          card.appendChild(snippetEl);
          hits.appendChild(card);
        }).catch(function (err) {
          console.warn('Failed to load search result content:', err.message);
        });
      });
      results.classList.remove('hidden');
    }

    if (input) {
      input.addEventListener('focus', loadPagefind);
      input.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        var q = input.value.trim();
        if (q.length < 2) {
          results.classList.add('hidden');
          return;
        }
        debounceTimer = setTimeout(function () {
          loadPagefind().then(function () {
            if (pagefind) {
              pagefind.search(q).then(renderHits).catch(function (err) {
                console.warn('Search failed:', err.message);
                status.textContent = 'Pencarian gagal, silakan coba lagi.';
                results.classList.remove('hidden');
              });
            }
          });
        }, 200);
      });
      document.addEventListener('click', function (e) {
        if (!document.getElementById('search-container').contains(e.target)) {
          results.classList.add('hidden');
        }
      });
    }
  })();
</script>
