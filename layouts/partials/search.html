{{/*
  Partial: search.html
  Renders a Pagefind-powered search bar.
  The search UI is a simple input that triggers Pagefind's search modal/overlay.
  Pagefind JS/CSS are loaded from /_pagefind/ after the build:index step.
*/}}
<div id="search-container" class="relative">
  <div class="relative">
    <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 dark:text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
    </svg>
    <input
      id="search-input"
      type="text"
      placeholder="Cari novel atau bab..."
      class="w-full rounded-full border border-slate-200 bg-white py-2.5 pl-10 pr-4 text-sm text-slate-900 shadow-soft placeholder:text-slate-400 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-400/20 dark:border-slate-700 dark:bg-slate-900 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-sky-500"
      aria-label="Cari novel atau bab"
    />
  </div>
  <div id="search-results" class="mt-3 hidden">
    <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-lg dark:border-slate-700 dark:bg-slate-900">
      <div id="search-status" class="mb-2 text-xs text-slate-500 dark:text-slate-400"></div>
      <div id="search-hits" class="grid gap-2"></div>
    </div>
  </div>
</div>

<script>
  (function () {
    var input = document.getElementById('search-input');
    var results = document.getElementById('search-results');
    var status = document.getElementById('search-status');
    var hits = document.getElementById('search-hits');
    var pagefind = null;
    var debounceTimer = null;

    async function loadPagefind() {
      if (pagefind) return;
      try {
        pagefind = await import('/_pagefind/pagefind.js');
        pagefind.init();
      } catch (e) {
        console.warn('Pagefind not available:', e.message);
        status.textContent = 'Pencarian belum tersedia.';
        results.classList.remove('hidden');
      }
    }

    function renderHits(data) {
      hits.innerHTML = '';
      if (!data.results || data.results.length === 0) {
        status.textContent = 'Tidak ada hasil ditemukan.';
        results.classList.remove('hidden');
        return;
      }
      status.textContent = data.results.length + ' hasil ditemukan.';
      data.results.slice(0, 8).forEach(function (result) {
        result.loadContent().then(function (content) {
          var card = document.createElement('a');
          card.href = result.url;
          card.className = 'block rounded-xl border border-slate-100 bg-slate-50 p-3 transition hover:border-sky-300 hover:bg-sky-50 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-sky-600';
          card.innerHTML = '<p class="text-sm font-medium text-slate-900 dark:text-white">' + result.meta.title + '</p>' +
            '<p class="mt-1 line-clamp-2 text-xs text-slate-500 dark:text-slate-400">' + content.substring(0, 120) + '…</p>';
          hits.appendChild(card);
        });
      });
      results.classList.remove('hidden');
    }

    if (input) {
      input.addEventListener('focus', loadPagefind);
      input.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        var q = input.value.trim();
        if (q.length < 2) {
          results.classList.add('hidden');
          return;
        }
        debounceTimer = setTimeout(function () {
          loadPagefind().then(function () {
            if (pagefind) {
              pagefind.search(q).then(renderHits);
            }
          });
        }, 200);
      });
      document.addEventListener('click', function (e) {
        if (!document.getElementById('search-container').contains(e.target)) {
          results.classList.add('hidden');
        }
      });
    }
  })();
</script>
