{{ $slot := .slot | default "generic" }}
{{ $raw := .html | default "" }}
{{ if ne $raw "" }}
  <div class="ad-slot" data-slot="{{ $slot }}">
    {{ $raw | safeHTML }}
  </div>
{{ else }}
  <!-- Ad slot placeholder: {{ $slot }} (hidden to preserve vertical rhythm) -->
  <div class="ad-slot hidden" data-slot="{{ $slot }}" aria-hidden="true"></div>
{{ end }}
