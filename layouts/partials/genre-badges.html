{{/*
  Partial: genre-badges.html
  Renders a list of genre badges.
  Usage: partial "genre-badges.html" (dict "genres" .Params.genres)
*/}}
{{ with .genres }}
  <div class="flex flex-wrap gap-1.5">
    {{ range . }}
      <span class="rounded-full border border-stone-200 bg-stone-100/60 px-2.5 py-0.5 text-xs font-medium text-stone-600 dark:border-stone-700 dark:bg-stone-800/60 dark:text-stone-300">{{ . }}</span>
    {{ end }}
  </div>
{{ end }}
